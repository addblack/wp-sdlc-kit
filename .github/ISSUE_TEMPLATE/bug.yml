name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See error"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: WordPress, PHP, theme/plugin versions, browser.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: debug.log lines, console errors.
